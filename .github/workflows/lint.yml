name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown (rumdl)
    runs-on: ubuntu-latest
    env:
      RUMDL_VERSION: v0.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rumdl
        run: |
          set -euo pipefail
          url="https://github.com/rvben/rumdl/releases/download/${RUMDL_VERSION}/rumdl-${RUMDL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/rumdl.tar.gz
          tar -xzf /tmp/rumdl.tar.gz -C /tmp
          install -m 0755 /tmp/rumdl /usr/local/bin/rumdl
          rumdl --version

      - name: Check Markdown formatting
        run: rumdl fmt --check .
