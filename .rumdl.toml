# rumdl configuration file

# Global configuration options
[global]
# MD013 (line length) is disabled: skill files and example blocks routinely
# exceed 100 chars and wrapping them would hurt readability.
#
# MD041 (first line must be an H1) is disabled: commands and agents must open
# with YAML frontmatter (`---`), CLAUDE.md opens with an `@AGENTS.md` include,
# and the bead-audit fixtures open with an HTML-comment Expected block, so a
# leading H1 is structurally wrong for this repo. `rumdl fmt --check` (what CI
# runs) never flagged these; this keeps `rumdl check` quiet too.
disable = ["MD013", "MD041"]

# List of rules to enable exclusively (if provided, only these rules will run)
# enable = ["MD001", "MD003", "MD004"]

# List of file/directory patterns to include for linting (if provided, only these will be linted)
# include = [
#    "docs/*.md",
#    "src/**/*.md",
#    "README.md"
# ]

# List of file/directory patterns to exclude from linting
exclude = [
    # Common directories to exclude
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",

    # outrigger's per-repo state. MEMORY.md documents its own format as
    # "each `- ` bullet is one entry", and MD038 wants to strip that trailing
    # space out of the inline code, which would make the file contradict the
    # format it is describing. The directory is tracked; it is only the linter
    # that has to stay out of it.
    ".outrigger",

    # Specific files or patterns
    "CHANGELOG.md",
    "LICENSE.md",
]

# Respect .gitignore files when scanning directories (default: true)
respect-gitignore = true

# Markdown flavor/dialect (uncomment to enable)
# Options: standard (default), gfm, commonmark, mkdocs, mdx, quarto
# flavor = "mkdocs"

# Rule-specific configurations (uncomment and modify as needed)

# [MD003]
# style = "atx"  # Heading style (atx, atx_closed, setext)

# [MD004]
# style = "asterisk"  # Unordered list style (asterisk, plus, dash, consistent)

# [MD007]
# indent = 4  # Unordered list indentation

# [MD044]
# names = ["rumdl", "Markdown", "GitHub"]  # Proper names that should be capitalized correctly
# code-blocks = false  # Check code blocks for proper names (default: false, skips code blocks)
