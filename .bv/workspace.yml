# beads_viewer workspace configuration
# Generated automatically for beads (bd) compatibility

# Project metadata
name: templeton-agentic-dev-workbench
description: beads workspace for templeton-agentic-dev-workbench

# Database configuration
database:
  path: .beads/beads.db
  prefix: templeton-agentic-dev-workbench

# JSONL configuration
jsonl:
  path: .beads/issues.jsonl

# Display settings
display:
  max_title_length: 80
  show_closed: false
  group_by_status: true

# Priority labels
priority:
  labels:
    0: "P0 - Critical"
    1: "P1 - High"
    2: "P2 - Medium"
    3: "P3 - Low"
    4: "P4 - Backlog"

# Status labels
status:
  labels:
    open: "Open"
    in_progress: "In Progress"
    blocked: "Blocked"
    closed: "Closed"

# Type labels
type:
  labels:
    bug: "🐛 Bug"
    feature: "✨ Feature"
    task: "📋 Task"
    epic: "🎯 Epic"
    chore: "🔧 Chore"
